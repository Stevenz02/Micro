sonar.projectKey=uq-reto7-empleados
sonar.projectName=Reto 7 - Empleados
sonar.sourceEncoding=UTF-8
sonar.sources=Reto_4/empleados/app
sonar.tests=Reto_4/tests
sonar.test.inclusions=Reto_4/tests/test_empleados*.py
sonar.exclusions=**/__pycache__/**,**/reports/**
sonar.python.coverage.reportPaths=Reto_4/empleados/reports/coverage.xml
sonar.python.xunit.reportPath=Reto_4/empleados/reports/junit.xml

# Reto 7 (infraestructura): SonarQube mide la cobertura sobre el MISMO alcance que pytest.
# Fuera del alcance de cobertura definido en el Reto 6 (Jenkinsfile: --cov main, models, events):
# adaptador SQL (lo valida la prueba de integración con Testcontainers), configuración y cliente HTTP.
# Esos archivos SÍ se analizan (bugs, vulnerabilidades, code smells); solo no cuentan en cobertura.
sonar.coverage.exclusions=Reto_4/empleados/app/config.py,Reto_4/empleados/app/departamentos.py,Reto_4/empleados/app/repository.py,Reto_4/empleados/app/__init__.py
