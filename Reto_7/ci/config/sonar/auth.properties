sonar.projectKey=uq-reto7-auth
sonar.projectName=Reto 7 - Auth
sonar.sourceEncoding=UTF-8
sonar.sources=Reto_5/auth/auth_app,Reto_5/shared
sonar.tests=Reto_5/tests
sonar.test.inclusions=Reto_5/tests/test_auth.py
sonar.exclusions=**/__pycache__/**,**/reports/**
sonar.python.coverage.reportPaths=Reto_5/auth/reports/coverage.xml
sonar.python.xunit.reportPath=Reto_5/auth/reports/junit.xml

# Reto 7 (infraestructura): SonarQube mide la cobertura sobre el MISMO alcance que pytest.
# Fuera del alcance de cobertura definido en el Reto 6 (Jenkinsfile: --cov passwords, lifecycle, shared.tokens):
# API HTTP, adaptador RabbitMQ, adaptador SQL y configuración.
# Esos archivos SÍ se analizan (bugs, vulnerabilidades, code smells); solo no cuentan en cobertura.
sonar.coverage.exclusions=Reto_5/auth/auth_app/main.py,Reto_5/auth/auth_app/events.py,Reto_5/auth/auth_app/repository.py,Reto_5/auth/auth_app/config.py,**/__init__.py
