sonar.projectKey=uq-reto7-perfiles
sonar.projectName=Reto 7 - Perfiles
sonar.sourceEncoding=UTF-8
sonar.sources=Reto_4/perfiles
sonar.tests=Reto_4/perfiles
sonar.exclusions=Reto_4/perfiles/**/*_test.go,Reto_4/perfiles/reports/**
sonar.test.inclusions=Reto_4/perfiles/**/*_test.go
# Adaptadores que requieren PostgreSQL/RabbitMQ reales; la cobertura unitaria
# se exige sobre la API HTTP y sus reglas de entrada/salida.
sonar.coverage.exclusions=Reto_4/perfiles/main.go,Reto_4/perfiles/consumer.go
# Reto 7 (infraestructura): go test escribe rutas con el módulo (reto4/perfiles/...); SonarQube
# las busca desde la raíz del repo. El Jenkinsfile genera una copia con rutas Reto_4/perfiles/...
sonar.go.coverage.reportPaths=Reto_4/perfiles/reports/coverage.sonar.out

