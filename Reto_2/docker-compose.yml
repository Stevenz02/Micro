# Valores públicos de demostración para arrancar tras clonar sin crear .env.
# Un .env local o variables del entorno pueden sobrescribirlos.
services:
  database-empleados:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_EMPLEADOS_NAME:-empleados_db}
      POSTGRES_USER: ${DB_EMPLEADOS_USER:-empleados_user}
      POSTGRES_PASSWORD: ${DB_EMPLEADOS_PASSWORD:-empleados_local_demo}
    volumes:
      - vol-empleados:/var/lib/postgresql/data
      - ./empleados/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT id FROM empleados LIMIT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [empleados-db]

  database-departamentos:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DEPARTAMENTOS_NAME:-departamentos_db}
      POSTGRES_USER: ${DB_DEPARTAMENTOS_USER:-departamentos_user}
      POSTGRES_PASSWORD: ${DB_DEPARTAMENTOS_PASSWORD:-departamentos_local_demo}
    volumes:
      - vol-departamentos:/var/lib/postgresql/data
      - ./departamentos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT id FROM departamentos LIMIT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [departamentos-db]

  departamentos-service:
    build: ./departamentos
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_HOST: database-departamentos
      DB_PORT: 5432
      DB_NAME: ${DB_DEPARTAMENTOS_NAME:-departamentos_db}
      DB_USER: ${DB_DEPARTAMENTOS_USER:-departamentos_user}
      DB_PASSWORD: ${DB_DEPARTAMENTOS_PASSWORD:-departamentos_local_demo}
    depends_on:
      database-departamentos:
        condition: service_healthy
    ports: ["127.0.0.1:${DEPARTAMENTOS_PORT:-8081}:8081"]
    networks: [microservices-network, departamentos-db]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  empleados-service:
    build:
      context: ..
      dockerfile: Reto_2/empleados/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${DB_EMPLEADOS_NAME:-empleados_db}
      DB_USER: ${DB_EMPLEADOS_USER:-empleados_user}
      DB_PASSWORD: ${DB_EMPLEADOS_PASSWORD:-empleados_local_demo}
      DEPARTAMENTOS_SERVICE_URL: ${DEPARTAMENTOS_SERVICE_URL:-http://departamentos-service:8081}
      DEPARTAMENTOS_TIMEOUT_SECONDS: ${DEPARTAMENTOS_TIMEOUT_SECONDS:-2}
      DEPARTAMENTOS_MAX_RETRIES: ${DEPARTAMENTOS_MAX_RETRIES:-3}
      DEPARTAMENTOS_BACKOFF_SECONDS: ${DEPARTAMENTOS_BACKOFF_SECONDS:-1}
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
    ports: ["127.0.0.1:${EMPLEADOS_PORT:-8080}:8080"]
    networks: [microservices-network, empleados-db]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  microservices-network:
    driver: bridge
  empleados-db:
    internal: true
  departamentos-db:
    internal: true

volumes:
  vol-empleados:
  vol-departamentos:
