# Reto 8 - Prometheus (modelo PULL): cada 15 s "raspa" el endpoint de métricas de los 7 microservicios.
# Los targets son los NOMBRES DE SERVICIO de docker-compose.yml (DNS interno de la red microservices-network).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # 1) Punto de entrada único: su latencia y tasa de error son la vista del cliente (debe ir primero)
  - job_name: 'api-gateway'               # Python / FastAPI · prometheus-fastapi-instrumentator
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'empleados-service'         # Python / FastAPI · prometheus-fastapi-instrumentator
    metrics_path: '/metrics'
    # Servicio replicado: el DNS de Docker devuelve una IP por réplica
    dns_sd_configs:
      - names: ['empleados-service']
        type: A
        port: 8081
        refresh_interval: 15s

  - job_name: 'departamentos-service'     # Node.js / Express · prom-client
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['departamentos-service']
        type: A
        port: 8082
        refresh_interval: 15s

  - job_name: 'perfiles-service'          # Go · prometheus/client_golang
    metrics_path: '/metrics'
    static_configs:
      - targets: ['perfiles-service:8083']

  - job_name: 'notificaciones-service'    # Java / Spring Boot · Micrometer (Actuator)
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notificaciones-service:8084']

  - job_name: 'vacaciones-service'        # .NET 8 · prometheus-net
    metrics_path: '/metrics'
    static_configs:
      - targets: ['vacaciones-service:8085']

  - job_name: 'load-balancer'             # Traefik · peticiones por servicio y réplicas sanas
    metrics_path: '/metrics'
    static_configs:
      - targets: ['load-balancer:8080']

  - job_name: 'auth-service'              # Python / FastAPI · prometheus-fastapi-instrumentator
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8086']
