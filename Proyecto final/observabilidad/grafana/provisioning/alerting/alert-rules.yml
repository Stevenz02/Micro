# Reto 8 - Reglas de alerta aprovisionadas (Grafana Unified Alerting)
# Las plantillas usan {{ .Labels.job }} (equivalente a $labels.job) para no depender del escape de variables de entorno.
# 1) Servicio Caído  2) Alta Tasa de Errores 5xx  3) Alta Latencia  -> contact point discord-rrhh
apiVersion: 1
groups:
- orgId: 1
  name: ecosistema-rrhh
  folder: Reto 8 - Alertas
  interval: 30s
  rules:
  - uid: servicio-caido
    title: Servicio Caído
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      equipo: rrhh
    annotations:
      summary: El servicio {{ .Labels.job }} dejó de responder al scraping de Prometheus
      description: 'up{job="{{ .Labels.job }}"} == 0 durante 1 minuto. Revise: docker compose ps / docker compose logs {{ .Labels.job }}'
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: alta-tasa-5xx
    title: Alta Tasa de Errores 5xx
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      equipo: rrhh
    annotations:
      summary: '{{ .Labels.job }} responde más del 10% de peticiones con 5xx'
      description: Porcentaje de respuestas 5xx > 10% sostenido durante 2 minutos.
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (job) (rate(http_requests_total{status=~"5.."}[2m])) or sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[2m]))) / (sum by (job) (rate(http_requests_total[2m]))
          or sum by (job) (rate(http_server_requests_seconds_count[2m])))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.1
  - uid: alta-latencia
    title: Alta Latencia
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      equipo: rrhh
    annotations:
      summary: '{{ .Labels.job }} tiene latencia promedio mayor a 2 s'
      description: Latencia promedio > 2 s durante 2 minutos (sobrecarga o dependencia lenta).
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (job) (rate(http_request_duration_seconds_sum[1m])) / sum by (job) (rate(http_request_duration_seconds_count[1m])) or sum by (job) (rate(http_server_requests_seconds_sum[1m])) / sum
          by (job) (rate(http_server_requests_seconds_count[1m]))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
