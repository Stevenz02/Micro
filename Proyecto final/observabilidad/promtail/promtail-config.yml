# Reto 8 - Promtail: descubre los contenedores por el socket de Docker y envía sus logs (stdout) a Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Solo los contenedores de este proyecto (no Jenkins/SonarQube del Reto 7)
        filters:
          - name: label
            values: ["com.docker.compose.project=proyecto-final"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # Los microservicios escriben JSON: se promueve "level" a etiqueta (baja cardinalidad).
      # traceId queda en la línea y se filtra con | json | traceId="..." en LogQL.
      - json:
          expressions:
            level: level
      - template:
          source: level
          template: '{{ if .Value }}{{ ToUpper .Value }}{{ end }}'
      - labels:
          level:
