# Analisis integral del ecosistema (job "proyecto-final"). Cada microservicio tiene ademas su
# propio proyecto SonarQube (microservicios/<servicio>/sonar-project.properties).
sonar.projectKey=uq-proyecto-final
sonar.projectName=Proyecto final - Ecosistema RR. HH.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=microservicios
sonar.tests=microservicios/tests,microservicios/departamentos/tests,microservicios/notificaciones/src/test
# C# requiere el scanner para .NET: Vacaciones se analiza en su propio pipeline (ms-vacaciones)
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/target/**,**/bin/**,**/obj/**,**/reports/**,**/coverage/**,**/*_test.go,**/src/test/**,**/*.cs,**/vacaciones.tests/**
sonar.test.inclusions=**/tests/**,**/src/test/**
sonar.python.coverage.reportPaths=microservicios/reports/python-coverage.xml
sonar.javascript.lcov.reportPaths=microservicios/departamentos/coverage/lcov.info
sonar.java.binaries=microservicios/notificaciones/target/classes
sonar.java.test.binaries=microservicios/notificaciones/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=microservicios/notificaciones/target/site/jacoco/jacoco.xml

# Alcance de la cobertura unitaria (minimo 70 por ciento): logica de negocio de cada servicio.
# Los adaptadores de E/S (SQL, AMQP), el arranque y la instrumentacion de telemetria se
# analizan igual (bugs, vulnerabilidades, code smells), pero su comportamiento lo validan las
# pruebas de integracion (Testcontainers) y la suite BDD, no las pruebas unitarias.
sonar.coverage.exclusions=**/__init__.py,**/config.py,**/repository.py,microservicios/rabbitmq/**,microservicios/auth/hash_admin.py,microservicios/departamentos/src/index.js,microservicios/departamentos/src/tracing.js,microservicios/departamentos/src/config.js,microservicios/departamentos/src/repository.js,microservicios/perfiles/**,microservicios/notificaciones/src/main/java/co/edu/uq/notificaciones/Application.java,microservicios/notificaciones/src/main/java/co/edu/uq/notificaciones/EventConsumer.java,microservicios/notificaciones/src/main/java/co/edu/uq/notificaciones/NotificacionRepository.java,microservicios/notificaciones/src/main/java/co/edu/uq/notificaciones/SchemaMigration.java,microservicios/notificaciones/src/main/java/co/edu/uq/notificaciones/HealthController.java
