jenkins:
  systemMessage: "Proyecto final RR. HH. - configuración reproducible con JCasC."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# JENKINS_ADMIN_PASSWORD y E2E_ADMIN_PASSWORD se resuelven desde /run/secrets/<NOMBRE>
# (Docker Compose Secrets); el token de SonarQube lo genera sonar-init en un volumen compartido.
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "Token generado por sonar-init"
              secret: "${readFile:/run/proyecto-final/sonar-token}"
          - usernamePassword:
              scope: GLOBAL
              id: "proyecto-final-e2e-admin"
              description: "Administrador semilla para BDD"
              username: "${E2E_ADMIN_EMAIL}"
              password: "${E2E_ADMIN_PASSWORD}"

unclassified:
  location:
    url: "http://localhost:8090/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube-proyecto-final"
        serverUrl: "${SONAR_HOST_URL_JENKINS}"
        credentialsId: "sonarqube-token"

# Los pipelines se leen de los Jenkinsfile del proyecto, montado en /proyecto (solo lectura).
# Tras editar un Jenkinsfile: docker compose restart jenkins.
jobs:
  - script: |
      def raiz = '/proyecto'
      def servicios = ['empleados', 'departamentos', 'auth', 'perfiles', 'vacaciones', 'notificaciones', 'api-gateway']
      servicios.each { nombre ->
        pipelineJob('ms-' + nombre) {
          description('CI de ' + nombre + ': build, test (cobertura minima 70), quality (SonarQube) y package (registry local).')
          logRotator { numToKeep(15) }
          definition {
            cps {
              script(new File(raiz + '/microservicios/' + nombre + '/Jenkinsfile').getText('UTF-8'))
              sandbox(true)
            }
          }
        }
      }
      pipelineJob('proyecto-final') {
        description('Pipeline integral: build y pruebas de los 5 lenguajes, Quality Gate, 7 imagenes al registry y BDD.')
        logRotator { numToKeep(20) }
        definition {
          cps {
            script(new File(raiz + '/Jenkinsfile').getText('UTF-8'))
            sandbox(true)
          }
        }
      }
