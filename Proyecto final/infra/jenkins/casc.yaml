jenkins:
  systemMessage: "Proyecto final RR. HH. - configuración reproducible con JCasC."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "Token generado por sonar-init"
              secret: "${readFile:/run/proyecto-final/sonar-token}"
          - usernamePassword:
              scope: GLOBAL
              id: "proyecto-final-e2e-admin"
              description: "Administrador semilla para BDD"
              username: "${E2E_ADMIN_EMAIL}"
              password: "${E2E_ADMIN_PASSWORD}"

unclassified:
  location:
    url: "http://localhost:8090/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube-proyecto-final"
        serverUrl: "${SONAR_HOST_URL_JENKINS}"
        credentialsId: "sonarqube-token"

jobs:
  - script: |
      pipelineJob('proyecto-final') {
        description('Build, pruebas, Quality Gate, empaquetado y BDD del ecosistema completo.')
        logRotator { numToKeep(20) }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branches('${REPO_BRANCH}')
              }
            }
            scriptPath('Proyecto final/Jenkinsfile')
            lightweight(true)
          }
        }
      }
