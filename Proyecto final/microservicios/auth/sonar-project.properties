# Se ejecuta desde microservicios/:  sonar-scanner -Dproject.settings=auth/sonar-project.properties
sonar.projectKey=uq-proyecto-final-auth
sonar.projectName=Proyecto final - Autenticacion
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=auth/auth_app
sonar.tests=tests
sonar.test.inclusions=tests/test_auth*.py
sonar.exclusions=**/__pycache__/**,**/reports/**
sonar.python.coverage.reportPaths=auth/reports/coverage.xml
# Mismo alcance que pytest (.coveragerc): los adaptadores de E/S se analizan (bugs, vulnerabilidades,
# code smells) pero no cuentan en cobertura unitaria; los validan las pruebas de integracion y BDD.
sonar.coverage.exclusions=auth/auth_app/config.py,auth/auth_app/repository.py,**/__init__.py
