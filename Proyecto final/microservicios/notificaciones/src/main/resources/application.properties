spring.application.name=${OTEL_SERVICE_NAME:notificaciones-service}
server.port=8084
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
springdoc.swagger-ui.path=/notificaciones/docs

# ---------------- Proyecto final: correo SMTP y plantillas configurables ----------------
spring.mail.host=${SMTP_HOST:mailpit}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
# El servidor de correo no decide la salud del servicio: si cae, el evento igual se procesa
management.health.mail.enabled=false
notificaciones.plantillas.dir=${NOTIFICACIONES_PLANTILLAS_DIR:/app/plantillas}
notificaciones.remitente=${NOTIFICACIONES_REMITENTE:rrhh@empresa.local}
springdoc.api-docs.path=/notificaciones/openapi.json

# ---------------- Reto 8: observabilidad ----------------
# Actuator en /actuator: /actuator/prometheus (scraping) y /actuator/health (detalle de Spring).
# El /health del ecosistema (formato UP/DOWN + checks) lo sirve HealthController.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Trazas: Micrometer Tracing con el puente OpenTelemetry, exportando a Zipkin y propagando W3C
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
management.zipkin.tracing.endpoint=${OTEL_EXPORTER_ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
# El listener de RabbitMQ extrae traceparent de las cabeceras del mensaje (span CONSUMER hijo)
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.template.observation-enabled=true
