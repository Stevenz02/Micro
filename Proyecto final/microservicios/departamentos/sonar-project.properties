# Se ejecuta desde microservicios/departamentos/:  sonar-scanner
sonar.projectKey=uq-proyecto-final-departamentos
sonar.projectName=Proyecto final - Departamentos
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/reports/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Arranque, telemetria y adaptador SQL: se analizan pero no cuentan en cobertura unitaria
sonar.coverage.exclusions=src/index.js,src/tracing.js,src/config.js,src/repository.js
