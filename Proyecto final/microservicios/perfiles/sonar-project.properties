# Se ejecuta desde microservicios/perfiles/:  sonar-scanner
sonar.projectKey=uq-proyecto-final-perfiles
sonar.projectName=Proyecto final - Perfiles
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*_test.go,reports/**,docker-entrypoint.sh
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=reports/coverage.sonar.out
# Adaptadores que requieren PostgreSQL/RabbitMQ reales y la instrumentacion de telemetria:
# se analizan, pero su comportamiento se valida en la suite BDD, no con cobertura unitaria.
sonar.coverage.exclusions=consumer.go,observability.go
