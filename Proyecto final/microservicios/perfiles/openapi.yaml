openapi: 3.0.3
info:
  title: Proyecto final - Perfiles
  version: 1.0.0
  description: 'Perfil personal del empleado. Se crea y sincroniza por eventos (empleado.creado, empleado.actualizado)
    y se archiva con empleado.retirado. Cada empleado solo puede modificar su propio perfil: el API Gateway responde
    403 si el token pertenece a otro empleado.'
servers:
- url: /
paths:
  /perfiles:
    get:
      tags:
      - Perfiles
      summary: Listar perfiles
      responses:
        '200':
          description: Perfiles registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perfil'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /perfiles/{empleadoId}:
    get:
      tags:
      - Perfiles
      summary: Obtener el perfil de un empleado
      parameters:
      - in: path
        name: empleadoId
        required: true
        schema:
          type: string
        description: Identificador del empleado dueño del perfil
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Perfiles
      summary: Actualizar el perfil propio
      parameters:
      - in: path
        name: empleadoId
        required: true
        schema:
          type: string
        description: Identificador del empleado dueño del perfil
      description: Actualización parcial del perfil propio (contacto, dirección completa, foto, biografía y redes
        sociales).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilUpdate'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: JSON inválido, campo protegido o desconocido, o valor fuera de las reglas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El perfil pertenece a otro empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health:
    get:
      tags:
      - Salud
      summary: Estado del servicio y de sus dependencias
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: Alguna dependencia está caída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
components:
  schemas:
    Perfil:
      type: object
      properties:
        id:
          type: string
        empleadoId:
          type: string
          example: E001
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        cargo:
          type: string
        area:
          type: string
        departamentoId:
          type: string
        telefono:
          type: string
        direccion:
          type: string
        ciudad:
          type: string
        codigoPostal:
          type: string
          example: '630001'
        biografia:
          type: string
        fotoUrl:
          type: string
          format: uri
          example: https://cdn.empresa.com/fotos/E001.jpg
        redesSociales:
          type: object
          additionalProperties:
            type: string
            format: uri
          example:
            linkedin: https://www.linkedin.com/in/ana
            github: https://github.com/ana
        fechaCreacion:
          type: string
          format: date-time
        archivado:
          type: boolean
          description: true cuando el empleado fue retirado
    PerfilUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Actualización parcial: solo cambian los campos enviados; una cadena vacía borra el valor. Nombre,
        apellido, email, cargo, área y departamento los gestiona RR. HH. en Empleados y aquí son de solo lectura.'
      properties:
        telefono:
          type: string
          maxLength: 20
          pattern: ^[0-9+()\- ]{7,20}$
          example: '3001234567'
        direccion:
          type: string
          maxLength: 200
          example: 'Calle 10 # 5-20'
        ciudad:
          type: string
          maxLength: 100
          example: Armenia
        codigoPostal:
          type: string
          maxLength: 10
          pattern: ^[A-Za-z0-9 -]{3,10}$
          example: '630001'
        biografia:
          type: string
          maxLength: 1000
          example: Ingeniera de plataforma
        fotoUrl:
          type: string
          format: uri
          maxLength: 2048
          description: URL http(s) de la foto de perfil
          example: https://cdn.empresa.com/fotos/E001.jpg
        redesSociales:
          type: object
          description: 'Reemplaza el conjunto completo. Claves admitidas: linkedin, github, x, instagram, facebook,
            sitioWeb.'
          additionalProperties:
            type: string
            format: uri
          example:
            linkedin: https://www.linkedin.com/in/ana
            github: https://github.com/ana
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
    Salud:
      type: object
      required:
      - status
      - service
      - checks
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
            - UP
            - DOWN
