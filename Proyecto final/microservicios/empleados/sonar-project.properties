# Se ejecuta desde microservicios/:  sonar-scanner -Dproject.settings=empleados/sonar-project.properties
sonar.projectKey=uq-proyecto-final-empleados
sonar.projectName=Proyecto final - Empleados
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=empleados/app
sonar.tests=tests
sonar.test.inclusions=tests/test_empleados*.py,tests/test_eventos_empleados.py
sonar.exclusions=**/__pycache__/**,**/reports/**
sonar.python.coverage.reportPaths=empleados/reports/coverage.xml
# Mismo alcance que pytest (.coveragerc): los adaptadores de E/S se analizan (bugs, vulnerabilidades,
# code smells) pero no cuentan en cobertura unitaria; los validan las pruebas de integracion y BDD.
sonar.coverage.exclusions=empleados/app/config.py,empleados/app/repository.py,**/__init__.py
