            application/json:
              schema:
                $ref: '#/components/schemas/TokenOutput'
        '401':
          description: Credenciales inválidas
        '422':
          description: Cuerpo inválido
        '503':
          description: Auth no disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  examples:
                  - usuario@empresa.com
                  title: Email
                  type: string
                password:
                  examples:
                  - ClavePersonal2026
                  title: Password
                  type: string
              required:
