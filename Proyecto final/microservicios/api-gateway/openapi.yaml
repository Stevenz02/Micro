            application/json:
              schema: {}
        '400':
          description: Token o contraseña inválidos
        '422':
          description: Cuerpo inválido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                token:
                  description: Token recibido en la notificación de seguridad
                  title: Token
                  type: string
                newPassword:
                  description: Contraseña nueva según la política de Auth
                  title: Newpassword
                  type: string
              required:
              - token
              - newPassword
              title: ResetInput
              type: object
  /auth/change-password:
    post:
      tags:
      - Autenticación
      summary: Auth Change
      operationId: auth_change_auth_change_password_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Contraseña actual incorrecta o nueva inválida
        '401':
          description: Token inválido o cuenta no disponible
        '409':
          description: La cuenta cambió durante la operación
        '422':
          description: Cuerpo inválido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                currentPassword:
                  title: Currentpassword
                  type: string
                newPassword:
                  title: Newpassword
                  type: string
              required:
              - currentPassword
              - newPassword
              title: ChangeInput
              type: object
      security:
      - BearerAuth: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TokenOutput:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      title: TokenOutput
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
