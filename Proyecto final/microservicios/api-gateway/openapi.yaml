            application/json:
              schema: {}
      security:
      - BearerAuth: []
  /empleados/{empleado_id}/completo:
    get:
      tags:
      - Composición
      summary: Empleado y perfil en una sola respuesta (API Composition)
      description: 'Combina Empleados (dato obligatorio) y Perfiles (dato complementario) en paralelo.


        Fallo parcial: si Perfiles no responde, se devuelve igualmente el empleado con

        `perfil: null` y `parcial: true`; solo la caída de Empleados produce un error.'
      operationId: empleado_completo_empleados__empleado_id__completo_get
      parameters:
      - name: empleado_id
        in: path
        required: true
        schema:
          type: string
          title: Empleado Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: El empleado no existe
        '503':
          description: Empleados no disponible
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
