openapi: 3.1.0
info:
  title: Proyecto final - API Gateway
  description: Entrada única con validación HS256, RBAC y propiedad del perfil. Para explorar contratos completos
    use /auth/docs, /empleados/docs, /departamentos/docs, /perfiles/docs, /notificaciones/docs y /vacaciones/docs.
    Obtenga access_token en POST /auth/login y péguelo en Authorize.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Salud
      summary: Health
      description: 'Reto 8: el Gateway no tiene BD ni broker; su salud depende de alcanzar los upstreams.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/dependencies:
    get:
      tags:
      - Empleados
      summary: Dependencies
      operationId: dependencies_health_dependencies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /empleados/{empleado_id}/completo:
    get:
      tags:
      - Composición
      summary: Empleado y perfil en una sola respuesta (API Composition)
      description: 'Combina Empleados (dato obligatorio) y Perfiles (dato complementario) en paralelo.


        Fallo parcial: si Perfiles no responde, se devuelve igualmente el empleado con

        `perfil: null` y `parcial: true`; solo la caída de Empleados produce un error.'
      operationId: empleado_completo_empleados__empleado_id__completo_get
      parameters:
      - name: empleado_id
        in: path
        required: true
        schema:
          type: string
          title: Empleado Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: El empleado no existe
        '503':
          description: Empleados no disponible
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Auth Login
      operationId: auth_login_auth_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOutput'
        '401':
          description: Credenciales inválidas
        '422':
          description: Cuerpo inválido
        '503':
          description: Auth no disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  examples:
                  - usuario@empresa.com
                  title: Email
                  type: string
                password:
                  examples:
                  - ClavePersonal2026
                  title: Password
                  type: string
              required:
              - email
              - password
              title: LoginInput
              type: object
  /auth/recover-password:
    post:
      tags:
      - Autenticación
      summary: Auth Recover
      operationId: auth_recover_auth_recover_password_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Cuerpo inválido
        '503':
          description: Auth no disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  examples:
                  - usuario@empresa.com
                  title: Email
                  type: string
              required:
              - email
              title: RecoverInput
              type: object
  /auth/reset-password:
    post:
      tags:
      - Autenticación
      summary: Auth Reset
      operationId: auth_reset_auth_reset_password_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Token o contraseña inválidos
        '422':
          description: Cuerpo inválido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                token:
                  description: Token recibido en la notificación de seguridad
                  title: Token
                  type: string
                newPassword:
                  description: Contraseña nueva según la política de Auth
                  title: Newpassword
                  type: string
              required:
              - token
              - newPassword
              title: ResetInput
              type: object
  /auth/change-password:
    post:
      tags:
      - Autenticación
      summary: Auth Change
      operationId: auth_change_auth_change_password_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Contraseña actual incorrecta o nueva inválida
        '401':
          description: Token inválido o cuenta no disponible
        '409':
          description: La cuenta cambió durante la operación
        '422':
          description: Cuerpo inválido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                currentPassword:
                  title: Currentpassword
                  type: string
                newPassword:
                  title: Newpassword
                  type: string
              required:
              - currentPassword
              - newPassword
              title: ChangeInput
              type: object
      security:
      - BearerAuth: []
  /empleados:
    post:
      tags:
      - Empleados
      summary: Registrar empleado activo o pendiente
      operationId: registrar_empleados_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empleados_Empleado'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Empleado'
        '400':
          description: Email, numero o id duplicado; departamento inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '500':
          description: Error interno de persistencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '202':
          description: Empleado recibido en estado PENDIENTE por dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Empleado'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_HTTPValidationError'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    get:
      tags:
      - Empleados
      summary: Listar empleados
      operationId: listar_empleados_get
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - ACTIVO
            - EN_VACACIONES
            - RETIRADO
            - PENDIENTE
            - RECHAZADO
            type: string
          - type: 'null'
          title: Estado
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Hasta
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empleados_Empleado'
                title: Response Listar Empleados Get
        '500':
          description: Error interno de persistencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_HTTPValidationError'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /empleados/{id}:
    put:
      tags:
      - Empleados
      summary: Actualizar un empleado activo sin modificar su identidad o estado
      operationId: actualizar_empleados__id__put
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empleados_EmpleadoActualizacion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Empleado'
        '400':
          description: Email, numero o id duplicado; departamento inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '500':
          description: Error interno de persistencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_HTTPValidationError'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    delete:
      tags:
      - Empleados
      summary: Retirar un empleado mediante baja logica
      operationId: retirar_empleados__id__delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: motivo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Motivo obligatorio para el primer retiro; la repetición idempotente no lo requiere
          title: Motivo
        description: Motivo obligatorio para el primer retiro; la repetición idempotente no lo requiere
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Empleado'
        '400':
          description: Email, numero o id duplicado; departamento inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '500':
          description: Error interno de persistencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_HTTPValidationError'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    get:
      tags:
      - Empleados
      summary: Consultar empleado
      operationId: obtener_empleados__id__get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Empleado'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '500':
          description: Error interno de persistencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleados_HTTPValidationError'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /departamentos:
    post:
      tags:
      - Departamentos
      summary: Crear departamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Departamentos_Departamento'
      responses:
        '201':
          description: Departamento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Departamento'
        '400':
          description: Datos inválidos o id duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '413':
          description: Cuerpo demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    get:
      tags:
      - Departamentos
      summary: Listar departamentos
      responses:
        '200':
          description: Departamentos registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departamentos_Departamento'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /departamentos/{id}:
    get:
      tags:
      - Departamentos
      summary: Consultar departamento
      responses:
        '200':
          description: Departamento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Departamento'
        '404':
          description: Departamento inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    put:
      tags:
      - Departamentos
      summary: Actualizar nombre y descripción (el id es inmutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Departamentos_DepartamentoActualizacion'
      responses:
        '200':
          description: Departamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Departamento'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '404':
          description: Departamento inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    delete:
      tags:
      - Departamentos
      summary: Eliminar departamento
      responses:
        '204':
          description: Departamento eliminado
        '404':
          description: Departamento inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamentos_Error'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /perfiles:
    get:
      tags:
      - Perfiles
      summary: Listar perfiles
      responses:
        '200':
          description: Perfiles registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perfiles_Perfil'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /perfiles/{empleadoId}:
    get:
      tags:
      - Perfiles
      summary: Obtener el perfil de un empleado
      parameters:
      - in: path
        name: empleadoId
        required: true
        schema:
          type: string
        description: Identificador del empleado dueño del perfil
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Perfil'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    put:
      tags:
      - Perfiles
      summary: Actualizar el perfil propio
      parameters:
      - in: path
        name: empleadoId
        required: true
        schema:
          type: string
        description: Identificador del empleado dueño del perfil
      description: Solo se aceptan los campos editables por el empleado; los datos laborales se sincronizan desde
        Empleados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfiles_PerfilUpdate'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Perfil'
        '400':
          description: JSON inválido, campo protegido o desconocido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '403':
          description: El perfil pertenece a otro empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '404':
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfiles_Error'
      security:
      - BearerAuth: []
  /notificaciones:
    get:
      tags:
      - Notificaciones
      summary: Listar el historial completo
      operationId: all
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificaciones_Notificacion'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /notificaciones/{empleadoId}:
    get:
      tags:
      - Notificaciones
      summary: Listar notificaciones de un empleado
      operationId: byEmpleado
      parameters:
      - name: empleadoId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificaciones_Notificacion'
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /notificaciones/seguridad/{id}/token:
    get:
      tags:
      - Notificaciones
      summary: Consultar token de entrega simulado (solo ADMIN, mientras esté vigente)
      operationId: deliveryToken
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Authenticated-Role
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /vacaciones:
    post:
      tags:
      - Vacaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vacaciones_VacacionRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacaciones_Vacacion'
        '400':
          description: Bad Request
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
    get:
      tags:
      - Vacaciones
      parameters:
      - name: empleadoId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          description: Bearer ausente o inválido
        '403':
          description: Permiso insuficiente
      security:
      - BearerAuth: []
  /vacaciones/{id}:
    get:
      tags:
      - Vacaciones
      parameters:
      - name: id
        in: path
        required: true
        schema:
