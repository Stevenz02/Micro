openapi: 3.1.0
info:
  title: Proyecto final - API Gateway
  description: Entrada única con validación HS256, RBAC y propiedad del perfil. Para explorar contratos completos
    use /auth/docs, /empleados/docs, /departamentos/docs, /perfiles/docs, /notificaciones/docs y /vacaciones/docs.
    Obtenga access_token en POST /auth/login y péguelo en Authorize.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Salud
      summary: Health
      description: 'Reto 8: el Gateway no tiene BD ni broker; su salud depende de alcanzar los upstreams.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/dependencies:
    get:
      tags:
      - Salud
      summary: Dependencies
      operationId: dependencies_health_dependencies_get
      responses:
        '200':
          description: Successful Response
