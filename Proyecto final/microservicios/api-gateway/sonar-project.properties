# Se ejecuta desde microservicios/:  sonar-scanner -Dproject.settings=api-gateway/sonar-project.properties
sonar.projectKey=uq-proyecto-final-api-gateway
sonar.projectName=Proyecto final - API Gateway
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=api-gateway/gateway_app
sonar.tests=tests
sonar.test.inclusions=tests/test_gateway.py
sonar.exclusions=**/__pycache__/**,**/reports/**
sonar.python.coverage.reportPaths=api-gateway/reports/coverage.xml
# Mismo alcance que pytest (.coveragerc): los adaptadores de E/S se analizan (bugs, vulnerabilidades,
# code smells) pero no cuentan en cobertura unitaria; los validan las pruebas de integracion y BDD.
sonar.coverage.exclusions=api-gateway/gateway_app/config.py,api-gateway/gateway_app/repository.py,**/__init__.py
